name: SDK Candidate

# Manually dispatchable validation build only. Does NOT publish/release/tag
# anything — no npm publish, no GitHub Release. See RELEASE_PROCESS.md gate 3.
# Deliberately carries no `id-token: write` permission so it is structurally
# incapable of npm's OIDC trusted publishing, not just procedurally skipped.

on:
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run build
      - run: npm run test
