name: CI

# workflow_dispatch-only — this IS the SDK's candidate role (npm run uat
# targets this file): the package artifact is the npm registry entry, so a
# validation run is all "candidate" means here. Deliberately not on push/PR
# — build/test already happens locally before a push, and this is the
# on-demand cloud-environment check for when you choose to run it, not an
# automatic pass on every commit. `permissions` is pinned to contents:read so
# this workflow is structurally incapable of npm's OIDC trusted publishing
# (id-token is never granted).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run verify:consumer

      # UAT produces the exact npm tarball production will publish. The tag
      # workflow downloads and checksum-verifies this artifact; it never
      # rebuilds the package.
      - name: Pack candidate package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-package
          tarball=$(npm pack --json | jq -r '.[0].filename')
          mv "$tarball" candidate-package/
          (cd candidate-package && sha256sum *.tgz > SHA256SUMS.txt)

      - name: Store private candidate package outside Actions artifact quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="candidate-${GITHUB_SHA}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "UAT candidate ${GITHUB_SHA}" \
            --notes "Private SDK UAT candidate from run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            candidate-package/*

      # No "version ahead of npm-published" check here on purpose: most changes
      # have nothing to bump — it's fine to build/test the same version
      # repeatedly. That check belongs at the moment a release actually goes
      # public: release.yml's `npm publish` will itself refuse to publish a
      # version that's already on the registry.
