name: CI

# Push/PR guard, and — via workflow_dispatch — also the SDK's candidate role:
# the package artifact is the npm registry entry, so a validation run is all
# "candidate" means here. `permissions` is pinned to contents:read so this
# workflow is structurally incapable of npm's OIDC trusted publishing
# (id-token is never granted).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

      # No "version ahead of npm-published" check here on purpose: this job
      # runs on every push to main, and most merges (CI/docs-only changes)
      # have nothing to bump — it's fine to build/test the same version
      # repeatedly. That check belongs at the moment a release actually goes
      # public: release.yml's `npm publish` will itself refuse to publish a
      # version that's already on the registry.
